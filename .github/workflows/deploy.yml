name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild daily at 06:00 JST (21:00 UTC) to refresh note RSS feed
    - cron: '0 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: '22'

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages waits at most 10 minutes for Pages to finish; on busy days a large
      # artifact can exceed that ("Timeout reached"). Retry once with the same artifact
      # instead of failing the run (2026-11-10).
      - name: Deploy to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Deploy to GitHub Pages (retry)
        id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - name: Report deployment URL
        id: deployment
        shell: bash
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
