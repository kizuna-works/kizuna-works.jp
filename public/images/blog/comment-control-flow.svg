<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-label="kintoneのコメントは、書く→メンションで宛先指定→相手に通知、の流れで届く">
  <rect width="960" height="240" rx="16" fill="#F0F4F8"/>

  <!-- Card 1: コメントを書く -->
  <rect x="40" y="56" width="220" height="128" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/>
  <rect x="96" y="86" width="108" height="44" rx="9" fill="#1B3A6B"/>
  <path d="M118 130 l0 20 l20 -20 z" fill="#1B3A6B"/>
  <rect x="110" y="100" width="80" height="6" rx="3" fill="#ffffff"/>
  <rect x="110" y="114" width="56" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
  <text x="150" y="168" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1B3A6B">コメントを書く</text>

  <!-- Arrow 1 -->
  <line x1="270" y1="120" x2="358" y2="120" stroke="#94a3b8" stroke-width="3"/>
  <path d="M358 120 l-12 -7 l0 14 z" fill="#94a3b8"/>

  <!-- Card 2: メンションで宛先指定 -->
  <rect x="370" y="56" width="220" height="128" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/>
  <circle cx="480" cy="106" r="26" fill="#E8730C"/>
  <text x="480" y="116" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#ffffff">@</text>
  <text x="480" y="168" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1B3A6B">宛先を指定（@）</text>

  <!-- Arrow 2 -->
  <line x1="600" y1="120" x2="688" y2="120" stroke="#94a3b8" stroke-width="3"/>
  <path d="M688 120 l-12 -7 l0 14 z" fill="#94a3b8"/>

  <!-- Card 3: 相手に通知 -->
  <rect x="700" y="56" width="220" height="128" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/>
  <path d="M810 84 c-13 0 -22 10 -22 24 l0 14 l-8 8 l60 0 l-8 -8 l0 -14 c0 -14 -9 -24 -22 -24 z" fill="#2E8B2E"/>
  <circle cx="810" cy="80" r="4" fill="#2E8B2E"/>
  <path d="M802 134 a8 8 0 0 0 16 0 z" fill="#2E8B2E"/>
  <circle cx="828" cy="80" r="9" fill="#E8730C"/>
  <text x="828" y="84" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="810" y="168" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1B3A6B">相手に通知が届く</text>
</svg>
