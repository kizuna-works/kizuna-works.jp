<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="コメント運用でよくある3つの困りごと：自分宛の見落とし、コメントが埋もれる、画面が狭い">
  <rect width="960" height="280" rx="16" fill="#F0F4F8"/>

  <!-- Card 1: 自分宛の見落とし -->
  <rect x="36" y="40" width="280" height="200" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/>
  <rect x="36" y="40" width="280" height="8" rx="4" fill="#E8730C"/>
  <circle cx="176" cy="108" r="34" fill="#FBE7D5"/>
  <text x="176" y="120" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#E8730C">@</text>
  <line x1="150" y1="84" x2="202" y2="132" stroke="#E8730C" stroke-width="5" stroke-linecap="round"/>
  <text x="176" y="180" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1B3A6B">自分宛を見落とす</text>
  <text x="176" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">通知に埋もれて気づけない</text>

  <!-- Card 2: コメントが埋もれる -->
  <rect x="340" y="40" width="280" height="200" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/>
  <rect x="340" y="40" width="280" height="8" rx="4" fill="#1B3A6B"/>
  <rect x="452" y="78" width="96" height="26" rx="7" fill="#cbd5e1"/>
  <rect x="444" y="92" width="96" height="26" rx="7" fill="#94a3b8"/>
  <rect x="436" y="106" width="96" height="26" rx="7" fill="#1B3A6B"/>
  <text x="480" y="180" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1B3A6B">コメントが埋もれる</text>
  <text x="480" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">一覧では有無が分からない</text>

  <!-- Card 3: 画面が狭い -->
  <rect x="644" y="40" width="280" height="200" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/>
  <rect x="644" y="40" width="280" height="8" rx="4" fill="#2E8B2E"/>
  <rect x="724" y="78" width="92" height="64" rx="6" fill="#eef2f7" stroke="#cbd5e1"/>
  <rect x="816" y="78" width="40" height="64" rx="6" fill="#2E8B2E" opacity="0.85"/>
  <line x1="724" y1="150" x2="816" y2="150" stroke="#94a3b8" stroke-width="3"/>
  <path d="M724 150 l12 -6 l0 12 z" fill="#94a3b8"/>
  <path d="M816 150 l-12 -6 l0 12 z" fill="#94a3b8"/>
  <text x="784" y="180" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1B3A6B">画面が狭くなる</text>
  <text x="784" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">コメント欄に幅を取られる</text>
</svg>
