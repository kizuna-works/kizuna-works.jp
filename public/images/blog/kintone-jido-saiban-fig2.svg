<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif">
  <rect width="1000" height="540" fill="#ffffff"/>

  <!-- title -->
  <text x="500" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#1B3A6B">条件分岐で「採番」が決まる仕組み</text>
  <rect x="378" y="58" width="244" height="4" rx="2" fill="#2E8B2E"/>

  <!-- step cards -->
  <g>
    <!-- step 1 -->
    <rect x="28" y="100" width="200" height="180" rx="14" fill="#F4F6FA" stroke="#1B3A6B" stroke-width="2"/>
    <circle cx="58" cy="132" r="16" fill="#1B3A6B"/>
    <text x="58" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
    <text x="84" y="138" font-size="18" font-weight="700" fill="#1B3A6B">区分を選択</text>
    <text x="48" y="186" font-size="15" fill="#2B2B2B">レコードの</text>
    <text x="48" y="210" font-size="15" fill="#2B2B2B">「区分」を入力</text>
    <rect x="48" y="226" width="160" height="34" rx="8" fill="#ffffff" stroke="#D5DCE8"/>
    <text x="128" y="249" text-anchor="middle" font-size="15" fill="#1B3A6B">見積 / 注文 / 請求</text>

    <!-- step 2 -->
    <rect x="272" y="100" width="200" height="180" rx="14" fill="#F4F6FA" stroke="#1B3A6B" stroke-width="2"/>
    <circle cx="302" cy="132" r="16" fill="#1B3A6B"/>
    <text x="302" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
    <text x="328" y="138" font-size="18" font-weight="700" fill="#1B3A6B">条件で判定</text>
    <text x="292" y="186" font-size="15" fill="#2B2B2B">区分の値で</text>
    <text x="292" y="210" font-size="15" fill="#2B2B2B">採番ルールを</text>
    <text x="292" y="234" font-size="15" fill="#2B2B2B">自動で切り替え</text>

    <!-- step 3 -->
    <rect x="516" y="100" width="200" height="180" rx="14" fill="#F1F8F1" stroke="#1A5C1A" stroke-width="2"/>
    <circle cx="546" cy="132" r="16" fill="#1A5C1A"/>
    <text x="546" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
    <text x="572" y="138" font-size="18" font-weight="700" fill="#1A5C1A">独立カウンター</text>
    <rect x="536" y="166" width="160" height="42" rx="8" fill="#ffffff" stroke="#CFE6CF"/>
    <text x="616" y="184" text-anchor="middle" font-size="13.5" fill="#3E7A3E">見積カウンター</text>
    <text x="616" y="201" text-anchor="middle" font-size="14" font-weight="700" fill="#1A5C1A">0001 → 0002</text>
    <rect x="536" y="216" width="160" height="42" rx="8" fill="#ffffff" stroke="#CFE6CF"/>
    <text x="616" y="234" text-anchor="middle" font-size="13.5" fill="#3E7A3E">注文カウンター</text>
    <text x="616" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#1A5C1A">0001 → 0002</text>

    <!-- step 4 -->
    <rect x="772" y="100" width="200" height="180" rx="14" fill="#F1F8F1" stroke="#1A5C1A" stroke-width="2"/>
    <circle cx="802" cy="132" r="16" fill="#1A5C1A"/>
    <text x="802" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4</text>
    <text x="828" y="138" font-size="18" font-weight="700" fill="#1A5C1A">フォーマット組立</text>
    <text x="792" y="186" font-size="15" fill="#2B2B2B">3つのパーツを</text>
    <text x="792" y="210" font-size="15" fill="#2B2B2B">自由に組み合わせ</text>
    <rect x="792" y="226" width="160" height="34" rx="8" fill="#ffffff" stroke="#CFE6CF"/>
    <text x="872" y="249" text-anchor="middle" font-size="14" fill="#1A5C1A">日付＋接頭辞＋連番</text>
  </g>

  <!-- arrows -->
  <g fill="#9AA8BE">
    <path d="M234 190 l22 0 l0 -8 l16 14 l-16 14 l0 -8 l-22 0 z"/>
    <path d="M478 190 l22 0 l0 -8 l16 14 l-16 14 l0 -8 l-22 0 z"/>
    <path d="M722 190 l22 0 l0 -8 l16 14 l-16 14 l0 -8 l-22 0 z"/>
  </g>

  <!-- result band -->
  <text x="500" y="338" text-anchor="middle" font-size="16" font-weight="700" fill="#5A6B82">▼ 採番結果（例）</text>
  <rect x="250" y="356" width="500" height="120" rx="14" fill="#1B3A6B"/>

  <!-- segmented result -->
  <g>
    <rect x="300" y="384" width="120" height="48" rx="8" fill="#2E8B2E"/>
    <text x="360" y="414" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">EST</text>

    <rect x="430" y="384" width="170" height="48" rx="8" fill="#3F6FB0"/>
    <text x="515" y="414" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">260613</text>

    <rect x="610" y="384" width="100" height="48" rx="8" fill="#2E8B2E"/>
    <text x="660" y="414" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">0001</text>
  </g>
  <g font-size="13" fill="#C6D2E6">
    <text x="360" y="456" text-anchor="middle">接頭辞</text>
    <text x="515" y="456" text-anchor="middle">日付（YYMMDD）</text>
    <text x="660" y="456" text-anchor="middle">連番</text>
  </g>

  <text x="500" y="512" text-anchor="middle" font-size="14" fill="#7A8AA3">区切り文字（- / _ / なし）・桁数・リセット単位（年/月/日）もノーコードで設定</text>
</svg>
