<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- title -->
  <text x="500" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1B3A6B">複数フィールド採番：1レコードで2つの番号を同時に採番</text>
  <rect x="330" y="58" width="340" height="4" rx="2" fill="#2E8B2E"/>

  <!-- column headers -->
  <text x="150" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#1B3A6B">入力（部署）</text>
  <text x="540" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1B3A6B">案件番号</text>
  <text x="540" y="122" text-anchor="middle" font-size="13" fill="#5b6b82">部署ごとに独立したカウンター</text>
  <text x="830" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1B3A6B">請求番号</text>
  <text x="830" y="122" text-anchor="middle" font-size="13" fill="#5b6b82">条件なし・全社で1つの通し番号</text>

  <!-- row 1: 営業一課 -->
  <rect x="40" y="150" width="220" height="80" rx="12" fill="#F4F6FA" stroke="#1B3A6B" stroke-width="2"/>
  <text x="150" y="182" text-anchor="middle" font-size="15" fill="#2B2B2B">部署</text>
  <text x="150" y="208" text-anchor="middle" font-size="19" font-weight="700" fill="#1B3A6B">営業一課</text>

  <rect x="420" y="150" width="240" height="80" rx="12" fill="#eef7ee" stroke="#2E8B2E" stroke-width="2"/>
  <text x="540" y="198" text-anchor="middle" font-size="22" font-weight="700" fill="#1f6b1f">A-2604-001</text>

  <rect x="710" y="150" width="240" height="80" rx="12" fill="#eef2fb" stroke="#1B3A6B" stroke-width="2"/>
  <text x="830" y="198" text-anchor="middle" font-size="22" font-weight="700" fill="#1B3A6B">26-INV-001</text>

  <!-- row 2: 営業二課 -->
  <rect x="40" y="270" width="220" height="80" rx="12" fill="#F4F6FA" stroke="#1B3A6B" stroke-width="2"/>
  <text x="150" y="302" text-anchor="middle" font-size="15" fill="#2B2B2B">部署</text>
  <text x="150" y="328" text-anchor="middle" font-size="19" font-weight="700" fill="#1B3A6B">営業二課</text>

  <rect x="420" y="270" width="240" height="80" rx="12" fill="#eef7ee" stroke="#2E8B2E" stroke-width="2"/>
  <text x="540" y="318" text-anchor="middle" font-size="22" font-weight="700" fill="#1f6b1f">B-2604-001</text>

  <rect x="710" y="270" width="240" height="80" rx="12" fill="#eef2fb" stroke="#1B3A6B" stroke-width="2"/>
  <text x="830" y="318" text-anchor="middle" font-size="22" font-weight="700" fill="#1B3A6B">26-INV-002</text>

  <!-- arrows: 部署 -> 案件番号 -->
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa7bd"/>
    </marker>
  </defs>
  <line x1="262" y1="190" x2="416" y2="190" stroke="#9aa7bd" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="262" y1="310" x2="416" y2="310" stroke="#9aa7bd" stroke-width="2.5" marker-end="url(#ah)"/>
  <!-- 案件番号 -> 請求番号 (同時) -->
  <line x1="662" y1="190" x2="706" y2="190" stroke="#cdd6e4" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="662" y1="310" x2="706" y2="310" stroke="#cdd6e4" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- counter notes -->
  <text x="540" y="252" text-anchor="middle" font-size="13" fill="#5b6b82">接頭辞A／B・連番とも部署別に独立</text>
  <text x="830" y="252" text-anchor="middle" font-size="13" fill="#5b6b82">部署に関係なく 001 → 002 と連番</text>

  <!-- bottom note -->
  <rect x="120" y="430" width="760" height="86" rx="14" fill="#1B3A6B"/>
  <text x="500" y="468" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1つのアプリ・1回の保存で、フィールドごとに別ルールで自動採番</text>
  <text x="500" y="496" text-anchor="middle" font-size="14" fill="#dbe4f3">案件番号は「部署で分ける」、請求番号は「全社で通す」を同時に実現</text>
</svg>
