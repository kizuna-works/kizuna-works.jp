<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="kintoneの履歴は変更履歴・ステータスの履歴・監査ログの3種類で、レコードを誰が閲覧したかは標準では記録されない">
  <rect width="960" height="320" rx="16" fill="#F0F4F8"/>

  <text x="480" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#1B3A6B">kintoneに残る「履歴」は3種類。閲覧だけが記録されない</text>

  <!-- Card 1: 変更履歴 -->
  <rect x="32" y="70" width="203" height="200" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/>
  <rect x="32" y="70" width="203" height="6" rx="3" fill="#1B3A6B"/>
  <text x="133.5" y="106" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1B3A6B">変更履歴</text>
  <line x1="56" y1="122" x2="211" y2="122" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="56" y="146" font-family="sans-serif" font-size="12" font-weight="700" fill="#5a6b82">見る場所</text>
  <text x="56" y="166" font-family="sans-serif" font-size="13" fill="#1f2a3a">レコード詳細画面</text>
  <text x="56" y="196" font-family="sans-serif" font-size="12" font-weight="700" fill="#5a6b82">分かること</text>
  <text x="56" y="216" font-family="sans-serif" font-size="13" fill="#1f2a3a">いつ・誰が・どこを</text>
  <text x="56" y="234" font-family="sans-serif" font-size="13" fill="#1f2a3a">何から何に変えたか</text>
  <text x="56" y="256" font-family="sans-serif" font-size="12" fill="#2E8B2E">過去の版に戻せる</text>

  <!-- Card 2: ステータスの履歴 -->
  <rect x="263" y="70" width="203" height="200" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/>
  <rect x="263" y="70" width="203" height="6" rx="3" fill="#1B3A6B"/>
  <text x="364.5" y="106" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1B3A6B">ステータスの履歴</text>
  <line x1="287" y1="122" x2="442" y2="122" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="287" y="146" font-family="sans-serif" font-size="12" font-weight="700" fill="#5a6b82">見る場所</text>
  <text x="287" y="166" font-family="sans-serif" font-size="13" fill="#1f2a3a">レコード詳細画面</text>
  <text x="287" y="196" font-family="sans-serif" font-size="12" font-weight="700" fill="#5a6b82">分かること</text>
  <text x="287" y="216" font-family="sans-serif" font-size="13" fill="#1f2a3a">いつ・誰が・どの</text>
  <text x="287" y="234" font-family="sans-serif" font-size="13" fill="#1f2a3a">ステータスへ進めたか</text>
  <text x="287" y="256" font-family="sans-serif" font-size="12" fill="#2E8B2E">プロセス管理が前提</text>

  <!-- Card 3: 監査ログ -->
  <rect x="494" y="70" width="203" height="200" rx="14" fill="#ffffff" stroke="#d9e1ec" stroke-width="1.5"/>
  <rect x="494" y="70" width="203" height="6" rx="3" fill="#1B3A6B"/>
  <text x="595.5" y="106" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#1B3A6B">監査ログ</text>
  <line x1="518" y1="122" x2="673" y2="122" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="518" y="146" font-family="sans-serif" font-size="12" font-weight="700" fill="#5a6b82">見る場所</text>
  <text x="518" y="166" font-family="sans-serif" font-size="13" fill="#1f2a3a">cybozu.com共通管理</text>
  <text x="518" y="196" font-family="sans-serif" font-size="12" font-weight="700" fill="#5a6b82">分かること</text>
  <text x="518" y="216" font-family="sans-serif" font-size="13" fill="#1f2a3a">削除・書き出し・DL</text>
  <text x="518" y="234" font-family="sans-serif" font-size="13" fill="#1f2a3a">などの操作の記録</text>
  <text x="518" y="256" font-family="sans-serif" font-size="12" fill="#2E8B2E">共通管理者のみ／CSV可</text>

  <!-- Card 4: 閲覧（欠けている） -->
  <rect x="725" y="70" width="203" height="200" rx="14" fill="#eef1f6" stroke="#a9b6c8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="826.5" y="106" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#5a6b82">閲覧（既読）</text>
  <line x1="749" y1="122" x2="904" y2="122" stroke="#cfd8e4" stroke-width="1.5"/>
  <text x="749" y="146" font-family="sans-serif" font-size="12" font-weight="700" fill="#8a97a8">見る場所</text>
  <text x="749" y="166" font-family="sans-serif" font-size="13" fill="#8a97a8">標準機能にはない</text>
  <text x="749" y="196" font-family="sans-serif" font-size="12" font-weight="700" fill="#8a97a8">分かること</text>
  <text x="749" y="216" font-family="sans-serif" font-size="13" font-weight="700" fill="#C0392B">誰が読んだかは</text>
  <text x="749" y="234" font-family="sans-serif" font-size="13" font-weight="700" fill="#C0392B">記録されない</text>
  <text x="749" y="256" font-family="sans-serif" font-size="12" fill="#5a6b82">プラグインで補う</text>
</svg>
