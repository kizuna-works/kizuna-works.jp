            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow-card);
            text-align: center;

        .intro-card h2 {
            color: var(--color-navy);
            font-size: 1.5rem;

            display: inline-block;
        }

        .intro-card h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);

            height: 3px;
            background-color: var(--color-green);

        .intro-card p {

        /* Article Sections Container */
        .section-container {
            padding: 40px 5% 80px;
            max-width: 1200px;
            margin: 0 auto;

        .section-title {
            font-size: 1.75rem;
            color: var(--color-navy);
            margin-bottom: 30px;
            padding-left: 12px;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Grid Layout */
        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Shared Card Styles */
        .article-card {
            background-color: var(--color-white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .card-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background-color: #e2e8f0;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-date {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-button {
            margin-top: auto;
            display: inline-block;
            text-align: center;
            padding: 10px 15px;
            border: 1px solid var(--color-navy);
            color: var(--color-navy);
            border-radius: 6px;
            font-weight: bold;
            transition: all var(--transition-speed);
        }

        .article-card:hover .card-button {
            background-color: var(--color-navy);
            color: var(--color-white);
        }

        /* Coming Soon Card */
        .coming-soon-card {
            background-color: var(--color-white);
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: var(--shadow-card);
            color: var(--color-text-muted);
            grid-column: 1 / -1;
        }

        /* Note Badge */
        .note-badge {
            position: absolute;
            top: 15px;

            background-color: #2cb696;
            color: #fff;
            padding: 4px 12px;

            font-size: 0.8rem;
            font-weight: bold;

        }

        /* Note Card No Image Style */
        .note-card-no-image {

        }
        .note-card-no-image .card-content {

        }
        .card-meta {

            margin-bottom: 12px;

        .note-badge-inline {

            padding: 3px 10px;

            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Loading Spinner */
        .loading-container {
            text-align: center;
            padding: 40px 0;
            grid-column: 1 / -1;
            color: var(--color-text-muted);
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--color-green);
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message, .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            background: var(--color-white);
            border-radius: 10px;

        /* Footer */

        /* Responsive Design */

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const RSS_URL = "https://note.com/kizuna_works/rss";
            const API_KEY = "ov8zqmcpon2nfe5tptbfyvolvr71cgkudmabt2ja";
            const API_ENDPOINT = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}&api_key=${API_KEY}&count=12`;
            
            const container = document.getElementById('note-articles');
            const loading = document.getElementById('note-loading');

            const formatDate = (dateString) => {
                if (!dateString) return '';
                const date = new Date(dateString.replace(/-/g, '/'));
                if (isNaN(date.getTime())) return dateString.split(' ')[0].replace(/-/g, '.');
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}.${month}.${day}`;
            };

            const stripHtml = (html) => {
                if (!html) return '';
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || '';
            };

            fetch(API_ENDPOINT)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    loading.remove();
                    if (data.status === 'ok' && data.items && data.items.length > 0) {
                        data.items.forEach(item => {
                            const excerpt = stripHtml(item.description).substring(0, 100) + '...';
                            const card = document.createElement('a');
                            card.href = item.link;
                            card.target = '_blank';
                            card.rel = 'noopener noreferrer';
                            card.className = 'article-card note-card-no-image';
                            card.innerHTML = `
                                <div class="card-content">
                                    <div class="card-meta">
                                        <span class="note-badge-inline">note</span>
                                        <span class="card-date">${formatDate(item.pubDate)}</span>
                                    </div>
                                    <h3 class="card-title">${item.title}</h3>
                                    <p class="card-excerpt">${excerpt}</p>
                                    <span class="card-button">noteで読む</span>
                                </div>
                            `;
                            container.appendChild(card);
                        });
                    } else {
                        container.innerHTML = '<div class="empty-message"><p>現在note記事はありません</p></div>';
                    }
                })
                .catch(error => {
                    console.error('RSS Fetch Error:', error);
                    loading.remove();
                    container.innerHTML = '<div class="error-message"><p>記事の取得に失敗しました</p></div>';
                });
        });
    </script>
